name: auto-expire
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: check-expiry-and-delete
        uses: actions/github-script@v7
        env:
          EXPIRE_AT: "2026-08-21T15:59:59Z"
        with:
          script: |
            const expire = Date.parse(process.env.EXPIRE_AT);
            if (Date.now() < expire) {
              console.log('未过期,保留页面');
              return;
            }
            try {
              const meta = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path: 'index.html'
              });
              await github.rest.repos.deleteFile({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'index.html',
                message: '邀请已过期,自动删除',
                sha: meta.data.sha
              });
              console.log('index.html 已自动删除');
            } catch (e) {
              console.log('可能已删除或出错: ' + e.message);
            }
